name: Build MAI V1.1 Tamil APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore MAI V1.1 source
        shell: bash
        run: |
          cat source/mai-v1.1.tar.xz.b64.part1 source/mai-v1.1.tar.xz.b64.part2 | base64 -d > /tmp/mai-v1.1.tar.xz
          tar -xJf /tmp/mai-v1.1.tar.xz
          test -f MAI-V1.1-Tamil/android/app/build.gradle.kts

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run backend tests
        working-directory: MAI-V1.1-Tamil/backend
        run: |
          python -m pip install -r requirements.txt
          PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android debug APK
        working-directory: MAI-V1.1-Tamil/android
        env:
          MAI_BACKEND_URL: ${{ secrets.MAI_BACKEND_URL }}
          MAI_GATEWAY_TOKEN: ${{ secrets.MAI_GATEWAY_TOKEN }}
        run: |
          gradle :app:assembleDebug -PMAI_BACKEND_URL="$MAI_BACKEND_URL" -PMAI_GATEWAY_TOKEN="$MAI_GATEWAY_TOKEN"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAI-V1.1-Tamil-debug-apk
          path: MAI-V1.1-Tamil/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish verified APK to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p builds
          cp MAI-V1.1-Tamil/android/app/build/outputs/apk/debug/app-debug.apk builds/MAI-V1.1-Tamil-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds/MAI-V1.1-Tamil-debug.apk
          git diff --cached --quiet || git commit -m "Publish verified MAI V1.1 Tamil debug APK"
          git push
